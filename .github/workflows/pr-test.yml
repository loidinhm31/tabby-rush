name: PR Verification (Tests Only)

"on":
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  APPROVED_HUB_ORIGIN: "https://api-glean-hub.qm-hub-v001.cloud"
  TABBYRUSH_API_KEY: "XoaJSoximq8EhK06IjXAQCOqKqRtM6qy"
jobs:
  test-shared:
    name: Shared KMP Tests (JVM & Room SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Shared JVM & SQLite Integration Tests
        id: shared_tests
        run: ./gradlew :shared:jvmTest --dependency-verification=off

      - name: Generate Shared Test Summary
        if: always()
        run: |
          echo "### 🧪 Shared Multiplatform Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.shared_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scope**: Core domain contracts, Room SQLite migrations, sync coordinator, and reminder lifecycle." >> "$GITHUB_STEP_SUMMARY"

  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Test Environment DotEnv
        run: |
          cat << 'EOF' > .env
          APPROVED_HUB_ORIGIN=https://api-glean-hub.qm-hub-v001.cloud
          TABBYRUSH_API_KEY=XoaJSoximq8EhK06IjXAQCOqKqRtM6qy
          EOF
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Install Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        id: android_tests
        run: ./gradlew :androidApp:testDebugUnitTest --dependency-verification=off

      - name: Generate Android Test Summary
        if: always()
        run: |
          echo "### 🤖 Android Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.android_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scope**: Android application container, view models, Glance widget, and receivers." >> "$GITHUB_STEP_SUMMARY"

  test-desktop-linux:
    name: Desktop Linux Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Test Environment DotEnv
        run: |
          cat << 'EOF' > .env
          APPROVED_HUB_ORIGIN=https://api-glean-hub.qm-hub-v001.cloud
          TABBYRUSH_API_KEY=XoaJSoximq8EhK06IjXAQCOqKqRtM6qy
          EOF
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Linux Desktop Unit Tests
        id: linux_tests
        run: ./gradlew -PdesktopTarget=linux :desktopApp:test --dependency-verification=off

      - name: Generate Linux Desktop Test Summary
        if: always()
        run: |
          echo "### 🐧 Desktop Linux Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.linux_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scope**: Desktop app lifecycle, Secret Service provider resolution, and tray controller." >> "$GITHUB_STEP_SUMMARY"

  test-desktop-windows:
    name: Desktop Windows Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Test Environment DotEnv
        shell: pwsh
        run: |
          Set-Content -Path .env -Value "APPROVED_HUB_ORIGIN=https://api-glean-hub.qm-hub-v001.cloud`nTABBYRUSH_API_KEY=XoaJSoximq8EhK06IjXAQCOqKqRtM6qy"
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Windows Desktop Unit Tests
        id: windows_tests
        run: .\gradlew.bat -PdesktopTarget=windows :desktopApp:test --dependency-verification=off

      - name: Generate Windows Desktop Test Summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 🪟 Desktop Windows Unit Tests"
          $testStatus = if ("${{ steps.windows_tests.outcome }}" -eq "success") { "✅ Passed" } else { "❌ Failed" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Status**: $testStatus"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Scope**: Desktop app lifecycle, Windows DPAPI vault provider, and tray controller."
