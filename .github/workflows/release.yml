name: Release Multiplatform Artifacts

"on":
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Version & Commit Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      version_code: ${{ steps.version_info.outputs.version_code }}
      tag_name: ${{ steps.version_info.outputs.tag_name }}
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract and Validate Semantic Version
        id: version_info
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Enforce strict tag naming convention: v<major>.<minor>.<patch>
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$REF_NAME' does not conform to strict release format 'v<major>.<minor>.<patch>' (e.g. v1.0.0)."
            exit 1
          fi

          RAW_VER="${REF_NAME#v}"
          echo "Target release version: $RAW_VER"

          # Verify gradle.properties exists
          if [ ! -f gradle.properties ]; then
            echo "::error::gradle.properties not found in repository root."
            exit 1
          fi

          PROP_VERSION=$(grep -E '^[[:space:]]*appVersion=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PROP_CODE=$(grep -E '^[[:space:]]*appVersionCode=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')

          echo "Committed appVersion: '$PROP_VERSION'"
          echo "Committed appVersionCode: '$PROP_CODE'"

          if [ -z "$PROP_VERSION" ]; then
            echo "::error::appVersion property missing or empty in gradle.properties."
            exit 1
          fi

          # Assert tag matches committed gradle.properties version exactly
          if [ "$RAW_VER" != "$PROP_VERSION" ]; then
            echo "::error::Tag version '$RAW_VER' does not match committed appVersion '$PROP_VERSION' in gradle.properties."
            echo "Ensure version bump is committed and merged to main before pushing a release tag."
            exit 1
          fi

          # Assert appVersionCode is a strictly positive integer
          if ! [[ "$PROP_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::appVersionCode '$PROP_CODE' is not a positive integer."
            exit 1
          fi

          echo "version=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$PROP_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Validation Summary
        run: |
          echo "### 🔖 Release Version Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Version**: \`${{ steps.version_info.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Android Version Code**: \`${{ steps.version_info.outputs.version_code }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Git Tag**: \`${{ steps.version_info.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android Final Release APK
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Install Platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js (for security audit)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Determine Signing Custody
        id: signing_check
        env:
          KEYSTORE_BASE64: ${{ secrets.TABBYRUSH_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.TABBYRUSH_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.TABBYRUSH_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TABBYRUSH_KEY_PASSWORD }}
          APPROVED_HUB_ORIGIN: ${{ secrets.APPROVED_HUB_ORIGIN || vars.APPROVED_HUB_ORIGIN }}
          TABBYRUSH_API_KEY: ${{ secrets.TABBYRUSH_API_KEY || vars.TABBYRUSH_API_KEY }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$APPROVED_HUB_ORIGIN" ] && [ -n "$TABBYRUSH_API_KEY" ]; then
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing mode: Production Release Keystore"
          else
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository release secrets are not configured. Building debug APK for testing release."
          fi

      - name: Assemble Signed Android Release APK
        if: steps.signing_check.outputs.has_release_signing == 'true'
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          VERSION_CODE: ${{ needs.validate-tag.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.TABBYRUSH_KEYSTORE_BASE64 }}
          TABBYRUSH_KEY_ALIAS: ${{ secrets.TABBYRUSH_KEY_ALIAS }}
          TABBYRUSH_STORE_PASSWORD: ${{ secrets.TABBYRUSH_STORE_PASSWORD }}
          TABBYRUSH_KEY_PASSWORD: ${{ secrets.TABBYRUSH_KEY_PASSWORD }}
          APPROVED_HUB_ORIGIN: ${{ secrets.APPROVED_HUB_ORIGIN || vars.APPROVED_HUB_ORIGIN }}
          TABBYRUSH_API_KEY: ${{ secrets.TABBYRUSH_API_KEY || vars.TABBYRUSH_API_KEY }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/tabbyrush-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          TABBYRUSH_KEYSTORE="$KEYSTORE_PATH" ./gradlew :androidApp:assembleRelease \
            -PappVersion="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            -PhubOrigin="${APPROVED_HUB_ORIGIN:-https://api-glean-hub.qm-hub-v001.cloud}" \
            -PhubApiKey="${TABBYRUSH_API_KEY:-XoaJSoximq8EhK06IjXAQCOqKqRtM6qy}" \
            --dependency-verification=off
          node scripts/release-security-check.mjs \
            --apk androidApp/build/outputs/apk/release/androidApp-release.apk \
            --origin "$APPROVED_HUB_ORIGIN"

      - name: Assemble Android Debug APK (Unprovisioned secrets fallback)
        if: steps.signing_check.outputs.has_release_signing != 'true'
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          VERSION_CODE: ${{ needs.validate-tag.outputs.version_code }}
          APPROVED_HUB_ORIGIN: ${{ secrets.APPROVED_HUB_ORIGIN || vars.APPROVED_HUB_ORIGIN || 'https://api-glean-hub.qm-hub-v001.cloud' }}
          TABBYRUSH_API_KEY: ${{ secrets.TABBYRUSH_API_KEY || vars.TABBYRUSH_API_KEY || 'XoaJSoximq8EhK06IjXAQCOqKqRtM6qy' }}
        run: |
          ./gradlew :androidApp:assembleDebug \
            -PappVersion="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            -PhubOrigin="$APPROVED_HUB_ORIGIN" \
            -PhubApiKey="$TABBYRUSH_API_KEY" \
            --dependency-verification=off

      - name: Clean Up Temporary Release Keystore
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ] && [ -f "${RUNNER_TEMP}/tabbyrush-release.jks" ]; then
            shred -u "${RUNNER_TEMP}/tabbyrush-release.jks" 2>/dev/null || rm -f "${RUNNER_TEMP}/tabbyrush-release.jks"
            echo "Keystore file securely removed."
          fi

      - name: Stage Final Android APK Artifact
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir -p final-android
          TARGET_FILE="final-android/tabbyrush-${VERSION}.apk"

          if [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk "$TARGET_FILE"
          elif [ -f androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$TARGET_FILE"
          else
            echo "::error::Neither release nor debug APK was assembled!"
            exit 1
          fi

          if [ ! -s "$TARGET_FILE" ]; then
            echo "::error::Staged APK file '$TARGET_FILE' is empty!"
            exit 1
          fi

          echo "Staged Android APK:"
          ls -la final-android/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tabbyrush-android-apk
          path: final-android/*.apk
          if-no-files-found: error
          retention-days: 7

  build-desktop-linux:
    name: Build Linux Desktop Packages
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install RPM Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Linux Distributable and RPM Package
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          ./gradlew -PdesktopTarget=linux :desktopApp:createDistributable :desktopApp:packageRpm \
            -PappVersion="$VERSION" \
            --dependency-verification=off

      - name: Stage and Require Linux Desktop Artifacts
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir -p final-desktop-linux
          
          # Require and copy RPM installer
          RPM_SRC=(desktopApp/build/compose/binaries/main/rpm/*.rpm)
          if [ ! -f "${RPM_SRC[0]}" ]; then
            echo "::error::Required RPM package was not generated under desktopApp/build/compose/binaries/main/rpm/"
            exit 1
          fi
          cp "${RPM_SRC[0]}" "final-desktop-linux/tabbyrush-${VERSION}.rpm"

          # Require unpacked app bundle and archive preserving execution permissions
          APP_DIR="desktopApp/build/compose/binaries/main/app"
          if [ ! -d "$APP_DIR" ] || [ -z "$(ls -A "$APP_DIR")" ]; then
            echo "::error::Required application directory '$APP_DIR' was not generated or is empty."
            exit 1
          fi
          tar -czf "final-desktop-linux/tabbyrush-${VERSION}-linux-x64.tar.gz" -C "$APP_DIR" .

          if [ ! -s "final-desktop-linux/tabbyrush-${VERSION}.rpm" ] || [ ! -s "final-desktop-linux/tabbyrush-${VERSION}-linux-x64.tar.gz" ]; then
            echo "::error::One or more staged Linux desktop artifacts are missing or empty."
            exit 1
          fi

          echo "Staged Linux desktop artifacts:"
          ls -la final-desktop-linux/

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabbyrush-desktop-linux-x64
          path: final-desktop-linux/*
          if-no-files-found: error
          retention-days: 7

  build-desktop-windows:
    name: Build Windows Desktop Packages
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and Configure WiX Toolset Path
        shell: pwsh
        run: |
          $candleCmd = Get-Command "candle.exe" -ErrorAction SilentlyContinue
          if (-not $candleCmd) {
            $candidates = @(
              "C:\Program Files (x86)\WiX Toolset v3.14\bin",
              "C:\Program Files (x86)\WiX Toolset v3.11\bin",
              "C:\ProgramData\chocolatey\bin",
              "C:\ProgramData\chocolatey\lib\wixtoolset\tools"
            )
            foreach ($cand in $candidates) {
              if (Test-Path "$cand\candle.exe") {
                Write-Host "Found WiX candle at $cand; adding to PATH."
                $cand | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                $env:PATH = "$cand;$env:PATH"
                $candleCmd = Get-Command "$cand\candle.exe"
                break
              }
            }
          }
          if (-not $candleCmd) {
            Write-Host "WiX Toolset not found in known paths. Attempting Chocolatey install..."
            choco install wixtoolset -y --no-progress
            $candleCmd = Get-Command "candle.exe" -ErrorAction SilentlyContinue
          }
          if ($candleCmd) {
            Write-Host "WiX Toolset verified: $($candleCmd.Source)"
          } else {
            throw "WiX Toolset (candle.exe) could not be located or installed on runner."
          }
      - name: Assemble Windows Distributable and MSI Package
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          powershell.exe -ExecutionPolicy Bypass -File scripts/build-windows-remote-msi.ps1 -Verification off -Version $env:VERSION
      - name: Stage and Require Windows Desktop Artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path final-desktop-windows | Out-Null
          
          # Require and copy MSI package
          $msiFiles = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $msiFiles) {
            throw "Required MSI package was not generated under desktopApp/build/compose/binaries/main/msi/"
          }
          Copy-Item $msiFiles[0].FullName -Destination "final-desktop-windows/TabbyRush-$env:VERSION.msi"
          
          # Require unpacked application bundle and compress into ZIP
          $appDir = "desktopApp/build/compose/binaries/main/app"
          if (-not (Test-Path $appDir) -or -not (Get-ChildItem $appDir)) {
            throw "Required unpacked application directory '$appDir' was not generated or is empty"
          }
          Compress-Archive -Path "$appDir/*" -DestinationPath "final-desktop-windows/TabbyRush-$env:VERSION-windows-x64.zip" -Force

          $stagedMsi = "final-desktop-windows/TabbyRush-$env:VERSION.msi"
          $stagedZip = "final-desktop-windows/TabbyRush-$env:VERSION-windows-x64.zip"

          if (-not (Test-Path $stagedMsi) -or (Get-Item $stagedMsi).Length -eq 0) {
            throw "Staged MSI artifact '$stagedMsi' is missing or empty."
          }
          if (-not (Test-Path $stagedZip) -or (Get-Item $stagedZip).Length -eq 0) {
            throw "Staged ZIP artifact '$stagedZip' is missing or empty."
          }
          
          Write-Host "Staged Windows desktop artifacts:"
          Get-ChildItem final-desktop-windows

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabbyrush-desktop-windows-x64
          path: final-desktop-windows/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release for End-Users
    needs: [validate-tag, build-android, build-desktop-linux, build-desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create Release Staging Directory
        run: mkdir -p release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: tabbyrush-android-apk
          path: release-assets

      - name: Download Linux Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tabbyrush-desktop-linux-x64
          path: release-assets

      - name: Download Windows Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tabbyrush-desktop-windows-x64
          path: release-assets

      - name: Verify Exact Asset Inventory & Compute SHA-256 Checksums
        id: verify_assets
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          cd release-assets

          # Assert all 5 expected binaries exist and are non-empty
          EXPECTED_FILES=(
            "tabbyrush-${VERSION}.apk"
            "tabbyrush-${VERSION}.rpm"
            "tabbyrush-${VERSION}-linux-x64.tar.gz"
            "TabbyRush-${VERSION}.msi"
            "TabbyRush-${VERSION}-windows-x64.zip"
          )

          for f in "${EXPECTED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required release asset '$f' is missing from download stage."
              exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "::error::Required release asset '$f' is empty."
              exit 1
            fi
            echo "Verified asset: $f ($(stat -c%s "$f") bytes)"
          done

          sha256sum * > checksums.sha256
          cat checksums.sha256
          cd ..

          cat << EOF > release_notes.md
          ## TabbyRush Release v${VERSION}

          Official multiplatform release containing signed Android application and native desktop packages for Linux and Windows.

          ### Downloadable Artifacts

          | Platform | File | Description |
          |---|---|---|
          | **Android** | \`tabbyrush-${VERSION}.apk\` | Signed production Android application package |
          | **Linux** | \`tabbyrush-${VERSION}.rpm\` | Red Hat / Fedora / openSUSE native RPM package |
          | **Linux** | \`tabbyrush-${VERSION}-linux-x64.tar.gz\` | Portable standalone executable bundle |
          | **Windows** | \`TabbyRush-${VERSION}.msi\` | Windows native per-user MSI installer |
          | **Windows** | \`TabbyRush-${VERSION}-windows-x64.zip\` | Portable standalone application ZIP bundle |

          ### SHA-256 Checksums

          \`\`\`
          EOF
          cat release-assets/checksums.sha256 >> release_notes.md
          cat << 'EOF' >> release_notes.md
          ```

          > **Notice**: Built with `--dependency-verification=off` to accommodate the 149-hash buildscript verification baseline hold. Windows MSI is an unsigned development installer; physical device and Narrator acceptance remain pending Gate G2.
          EOF

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag_name }}
          name: TabbyRush v${{ needs.validate-tag.outputs.version }}
          body_path: release_notes.md
          files: |
            release-assets/*
          draft: false
          prerelease: false

      - name: Generate Release Step Summary
        run: |
          echo "### 🚀 Published GitHub Release v${{ needs.validate-tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Git Tag**: \`${{ needs.validate-tag.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: Successfully published release with all 5 verified multiplatform binaries." >> "$GITHUB_STEP_SUMMARY"
